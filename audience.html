<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聽眾互動卡｜校園性別事件處理實務</title><style>
:root{--navy:#1A2740;--cream:#F5F1EA;--warm:#F8F3E8;--line:#C9C7C0;--green:#3F5D4A;--yellow:#8A6A35;--red:#6E3A3A;--blue:#243447}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--navy);color:var(--warm)}.wrap{max-width:760px;margin:0 auto;padding:24px 18px 48px}h1{font-size:30px;margin:12px 0 6px}p{line-height:1.55;color:rgba(248,243,232,.82)}.hint{font-size:14px;border:1px solid rgba(248,243,232,.22);border-radius:14px;padding:12px;background:rgba(255,255,255,.06)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{border:1px solid rgba(248,243,232,.35);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.06);color:var(--warm);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card{min-height:128px;border-radius:22px;border:1px solid rgba(248,243,232,.22);display:grid;place-items:center;text-align:center;padding:18px;font-size:28px;font-weight:900;background:rgba(255,255,255,.08);color:var(--warm)}.card small{display:block;font-size:15px;font-weight:500;margin-top:6px;opacity:.85}.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}.blue{background:var(--blue)}.panel{display:none}.panel.active{display:block}textarea{width:100%;min-height:150px;border-radius:18px;border:1px solid rgba(248,243,232,.25);background:rgba(255,255,255,.08);color:var(--warm);font-size:18px;padding:14px;line-height:1.5}.big{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:26px;z-index:10}.big.show{display:grid}.big .letter{font-size:min(42vw,240px);font-weight:1000;line-height:.9}.big .label{font-size:min(9vw,56px);font-weight:900;margin-top:20px}.close{position:fixed;left:16px;top:16px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:10px 14px;background:rgba(0,0,0,.2);color:#fff}.footer{margin-top:24px;font-size:13px;color:rgba(248,243,232,.65)}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{min-height:110px}h1{font-size:26px}}
</style></head><body><div class="wrap"><h1>聽眾互動卡</h1><p>請依講者指示選一張卡，讓手機螢幕成為你的答案。這個頁面不會送出資料，也不會蒐集個資。</p><div class="hint">建議：把手機亮度調高，選好後舉起來。需要回到選單時，點畫面左上角「返回」。</div><div class="tabs"><button class="tab" data-tab="abcd">A/B/C/D</button><button class="tab" data-tab="light">三色卡</button><button class="tab" data-tab="yesno">是／否</button><button class="tab" data-tab="note">一句話</button></div>
<section class="panel active" id="abcd"><h2>A/B/C/D 選項卡</h2><div class="grid"><div class="card blue" data-letter="A" data-label="A"><div>A<small>選項 A</small></div></div><div class="card blue" data-letter="B" data-label="B"><div>B<small>選項 B</small></div></div><div class="card blue" data-letter="C" data-label="C"><div>C<small>選項 C</small></div></div><div class="card blue" data-letter="D" data-label="D"><div>D<small>選項 D</small></div></div></div></section>
<section class="panel" id="light"><h2>三色卡</h2><div class="grid"><div class="card green" data-letter="可以" data-label="我覺得可以"><div>可以<small>綠燈</small></div></div><div class="card yellow" data-letter="不確定" data-label="需要再想"><div>不確定<small>黃燈</small></div></div><div class="card red" data-letter="暫停" data-label="這樣有風險"><div>暫停<small>紅燈</small></div></div></div></section>
<section class="panel" id="yesno"><h2>是／否</h2><div class="grid"><div class="card green" data-letter="是" data-label="YES"><div>是<small>YES</small></div></div><div class="card red" data-letter="否" data-label="NO"><div>否<small>NO</small></div></div></div></section>
<section class="panel" id="note"><h2>一句話備忘</h2><p>寫下你想帶回學校的一句提醒。這只是存在你的手機裡，不會送出。</p><textarea placeholder="例如：第一時間不是查明真相，而是接住、紀錄、通報。"></textarea></section>
<div class="footer">離線／靜態頁面設計：不送出、不儲存到伺服器。若重新整理，文字可能消失。</div></div><div class="big" id="big"><button class="close" id="close">返回</button><div><div class="letter" id="bigLetter"></div><div class="label" id="bigLabel"></div></div></div><script>
const panels=[...document.querySelectorAll('.panel')];document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{panels.forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));});
const big=document.getElementById('big'),L=document.getElementById('bigLetter'),S=document.getElementById('bigLabel');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{big.className='big show '+[...c.classList].filter(x=>['green','yellow','red','blue'].includes(x)).join(' ');L.textContent=c.dataset.letter;S.textContent=c.dataset.label;});document.getElementById('close').onclick=()=>big.classList.remove('show');
</script></body></html>
