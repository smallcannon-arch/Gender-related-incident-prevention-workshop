<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>互動統計 Dashboard｜校園性別事件處理實務</title>
  <script src="./config.js"></script>
  <style>
    :root {
      --navy: #1A2740;
      --navy2: #243447;
      --paper: #F5F1EA;
      --muted: #C9C7C0;
      --text: #263142;
      --white: #FFFDF7;
      --green: #3E6B55;
      --yellow: #9A6A2F;
      --red: #8B3A3A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--navy);
      color: var(--paper);
      line-height: 1.5;
    }

    header {
      padding: 24px 30px;
      border-bottom: 1px solid rgba(245, 241, 234, 0.14);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 1px solid rgba(245, 241, 234, 0.28);
      background: rgba(245, 241, 234, 0.08);
      color: var(--paper);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 15px;
    }

    main {
      padding: 24px 30px 40px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--paper);
      color: var(--text);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.22);
      min-height: 260px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 22px;
    }

    .meta {
      font-size: 13px;
      color: rgba(38, 49, 66, 0.64);
      margin-bottom: 16px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 54px 1fr 46px;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }

    .label {
      font-weight: 800;
      color: var(--navy);
    }

    .bar-track {
      height: 24px;
      background: rgba(26, 39, 64, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--navy2);
      border-radius: 999px;
      transition: width .25s ease;
    }

    .count {
      text-align: right;
      font-weight: 800;
      color: var(--navy);
    }

    .traffic-grid {
      display: grid;
      gap: 12px;
    }

    .traffic-row {
      padding: 14px;
      border-radius: 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      font-weight: 800;
    }

    .green { background: var(--green); }
    .yellow { background: var(--yellow); }
    .red { background: var(--red); }

    .messages {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .msg {
      background: var(--white);
      border: 1px solid rgba(26,39,64,0.12);
      border-radius: 16px;
      padding: 14px;
      min-height: 86px;
      font-size: 17px;
      color: var(--navy);
    }

    .empty {
      color: rgba(38, 49, 66, 0.58);
      font-size: 15px;
    }

    .status {
      color: rgba(245,241,234,0.72);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      header { flex-direction: column; align-items: flex-start; }
      main { grid-template-columns: 1fr; padding: 18px; }
      .messages { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>互動統計 Dashboard</h1>
      <div class="status" id="status">尚未讀取</div>
    </div>
    <div class="toolbar">
      <button onclick="loadStats()">重新整理</button>
      <button onclick="toggleAutoRefresh()" id="autoBtn">自動更新：開</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>暖身投票｜最擔心什麼？</h2>
      <div class="meta">A 要不要通報｜B 家長會不會爆炸｜C 程序有沒有錯｜D 我是不是踩法規</div>
      <div id="q03"></div>
    </section>

    <section class="card">
      <h2>快問快答｜第一句話</h2>
      <div class="meta">A 謝謝你願意說｜B 你確定嗎｜C 他不是那種人｜D 你是不是誤會</div>
      <div id="q12"></div>
    </section>

    <section class="card">
      <h2>案例投票｜最不適合做什麼？</h2>
      <div class="meta">A 接住情緒｜B 確認安全｜C 客觀紀錄｜D 找雙方自行對質</div>
      <div id="q20"></div>
    </section>

    <section class="card">
      <h2>三色回饋</h2>
      <div class="meta">綠：知道下一步｜黃：還不確定｜紅：先停下來求助</div>
      <div id="traffic"></div>
    </section>

    <section class="card wide">
      <h2>匿名一句話</h2>
      <div class="meta">提醒：若出現可識別個案資訊，請不要投影分享。</div>
      <div class="messages" id="messages"></div>
    </section>
  </main>

  <script>
    const CONFIG = window.INTERACTION_CONFIG || {};
    const GAS_ENDPOINT = CONFIG.GAS_ENDPOINT || "";
    const SESSION_ID = CONFIG.SESSION_ID || "gender-seminar-2026";

    let autoRefresh = true;
    let timer = null;

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonpCallback_" + Date.now() + "_" + Math.round(Math.random() * 10000);
        const script = document.createElement("script");

        window[callbackName] = (data) => {
          resolve(data);
          cleanup();
        };

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("JSONP 載入失敗"));
        };

        const sep = url.includes("?") ? "&" : "?";
        script.src = url + sep + "callback=" + encodeURIComponent(callbackName) + "&_=" + Date.now();
        document.body.appendChild(script);
      });
    }

    function getQuestion(stats, id) {
      return (stats.questions && stats.questions[id]) || {};
    }

    function renderBars(elId, data, keys) {
      const el = document.getElementById(elId);
      const total = keys.reduce((sum, key) => sum + Number(data[key] || 0), 0);

      if (total === 0) {
        el.innerHTML = '<div class="empty">尚無資料</div>';
        return;
      }

      el.innerHTML = keys.map(key => {
        const count = Number(data[key] || 0);
        const pct = total ? Math.round((count / total) * 100) : 0;
        return `
          <div class="bar-row">
            <div class="label">${key}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="count">${count}</div>
          </div>
        `;
      }).join("");
    }

    function renderTraffic(data) {
      const el = document.getElementById("traffic");
      const green = Number(data.green || 0);
      const yellow = Number(data.yellow || 0);
      const red = Number(data.red || 0);
      const total = green + yellow + red;

      if (total === 0) {
        el.innerHTML = '<div class="empty">尚無資料</div>';
        return;
      }

      el.innerHTML = `
        <div class="traffic-grid">
          <div class="traffic-row green"><span>綠｜我知道下一步</span><span>${green}</span></div>
          <div class="traffic-row yellow"><span>黃｜我還不確定</span><span>${yellow}</span></div>
          <div class="traffic-row red"><span>紅｜我會想先停下來求助</span><span>${red}</span></div>
        </div>
      `;
    }

    function renderMessages(messages) {
      const el = document.getElementById("messages");
      if (!messages || messages.length === 0) {
        el.innerHTML = '<div class="empty">尚無留言</div>';
        return;
      }

      el.innerHTML = messages.slice(-12).reverse().map(msg => {
        const safe = String(msg.message || "").replace(/[<>]/g, "");
        return `<div class="msg">${safe}</div>`;
      }).join("");
    }

    async function loadStats() {
      if (!GAS_ENDPOINT || GAS_ENDPOINT.includes("請填入")) {
        document.getElementById("status").textContent = "尚未設定 GAS_ENDPOINT";
        return;
      }

      try {
        const url = GAS_ENDPOINT + "?action=stats&session_id=" + encodeURIComponent(SESSION_ID);
        const data = await jsonp(url);

        renderBars("q03", getQuestion(data, "q03_anxiety"), ["A", "B", "C", "D"]);
        renderBars("q12", getQuestion(data, "q12_first_words"), ["A", "B", "C", "D"]);
        renderBars("q20", getQuestion(data, "q20_case_first_step"), ["A", "B", "C", "D"]);
        renderTraffic(getQuestion(data, "q_flow_status"));
        renderMessages(data.messages || []);

        const now = new Date();
        document.getElementById("status").textContent = "最後更新：" + now.toLocaleTimeString("zh-TW");
      } catch (err) {
        document.getElementById("status").textContent = "讀取失敗：" + err.message;
      }
    }

    function toggleAutoRefresh() {
      autoRefresh = !autoRefresh;
      document.getElementById("autoBtn").textContent = "自動更新：" + (autoRefresh ? "開" : "關");
      setupTimer();
    }

    function setupTimer() {
      if (timer) clearInterval(timer);
      if (autoRefresh) timer = setInterval(loadStats, 5000);
    }

    loadStats();
    setupTimer();
  </script>
</body>
</html>
